name: Build Headless Chat Pack

on:
  workflow_dispatch:
  push:
    branches:
      - headless-measurement-harness
    paths-ignore:
      - '.github/headless-latest-run.json'
      - '.github/headless-build-diagnostics.txt'

permissions:
  contents: write
  actions: read

jobs:
  build-headless-chatpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build chat headless pack
        shell: bash
        run: |
          set +e
          ./gradlew desktop:chatHeadlessPack --no-daemon --stacktrace 2>&1 | tee .github/headless-build-full.log
          status=${PIPESTATUS[0]}
          mkdir -p .github
          {
            echo "headless_build_exit_code=$status"
            echo
            echo "== Compiler/problem lines =="
            grep -nE '(^e: |^w: |FAILED|FAILURE:|Exception|Unresolved reference|Cannot access|Type mismatch|None of the following|Overload resolution|Compilation error|Execution failed)' .github/headless-build-full.log | tail -n 120 || true
            echo
            echo "== Last 180 build lines =="
            tail -n 180 .github/headless-build-full.log || true
          } > .github/headless-build-diagnostics.txt
          echo "HEADLESS_BUILD_EXIT_CODE=$status" >> "$GITHUB_ENV"
          exit $status

      - name: Upload chat headless pack
        uses: actions/upload-artifact@v4
        with:
          name: UncivHeadlessChatPack
          path: build/chat-headless/UncivHeadlessChatPack.zip
          retention-days: 7

      - name: Record latest run id
        if: always()
        shell: bash
        run: |
          mkdir -p .github
          cat > .github/headless-latest-run.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "branch": "${GITHUB_REF_NAME}",
            "sha": "${GITHUB_SHA}",
            "workflow": "${GITHUB_WORKFLOW}",
            "run_id": ${GITHUB_RUN_ID},
            "run_number": ${GITHUB_RUN_NUMBER},
            "run_attempt": ${GITHUB_RUN_ATTEMPT},
            "build_exit_code": ${HEADLESS_BUILD_EXIT_CODE:-999},
            "run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "artifact_name": "UncivHeadlessChatPack",
            "artifact_path": "build/chat-headless/UncivHeadlessChatPack.zip",
            "diagnostics_path": ".github/headless-build-diagnostics.txt"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/headless-latest-run.json .github/headless-build-diagnostics.txt
          if git diff --cached --quiet; then
            echo "Latest run record unchanged."
            exit 0
          fi
          git commit -m "Record headless chat pack workflow run [no apk]"
          git push
